# An author's project: a package whose kinds are generated from data (K4); the tests copy the declaration and the generator in.
[project]
name = "acme-series-tex"
version = "0.1.0"
description = "Card series generated from data"
requires-python = ">=3.15"
dynamic = ["dependencies"]  # the build writes the wheel's dependencies (B7)

[tool.texpkg]
distribution = "acme_series:dist"
generate = "acme_series_gen:sources"

[tool.pdm.build]
package-dir = "src"
includes = ["src/acme_series"]
custom-hook = "pdm_build.py"

[build-system]
requires = ["pdm-backend", "texpkg[build]"]
build-backend = "pdm.backend"
