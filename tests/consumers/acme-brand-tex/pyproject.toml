# An author's project: a texpkg package built from the synthetic acme brand (the declaration is copied in by the tests).
[project]
name = "acme-brand-tex"
version = "1.2.0"
description = "The synthetic acme brand as a TeX package"
requires-python = ">=3.15"
dynamic = ["dependencies"]  # the build writes the wheel's dependencies (B7)

[tool.texpkg]
distribution = "acme_brand:dist"

[tool.pdm.build]
package-dir = "src"
includes = ["src/acme_brand"]
custom-hook = "pdm_build.py"

[build-system]
requires = ["pdm-backend", "texpkg[build]"]
build-backend = "pdm.backend"
